<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interaktif Demir-Karbon Faz Diyagramı</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .calc-box {
      background: #ffffff;
      border: 1px solid #dcdfe6;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 380px;
      width: 100%;
      padding: 20px;
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 15px;
    }
    .btn-group button {
      flex: 1 1 30%;
      padding: 8px 4px;
      font-size: 13px;
      color: #333;
      border: 1px solid #005BBB;
      border-radius: 6px;
      background: #f9f9f9;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-group button:hover {
      background: #e6f2ff;
    }
    .btn-group button.active {
      background: #005BBB;
      color: #fff;
      border-color: #005BBB;
    }
    #svg-container {
      width: 100%;
      height: 300px;
      margin-bottom: 15px;
      position: relative;
      cursor: crosshair;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 6px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .input-row label {
      color: #333;
    }
    .input-row input[type="number"] {
      width: 75px;
      height: 32px;
      padding: 4px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .range-slider {
      -webkit-appearance: none;
      width: 100%;
      margin-top: 6px;
      margin-bottom: 6px;
      background: transparent;
    }
    .range-slider:focus {
      outline: none;
    }
    .range-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #d3d3d3;
      border-radius: 3px;
    }
    .range-slider::-webkit-slider-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #005BBB;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
    }
    .result-wrapper {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #eee;
    }
    #result table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }
    #result th, #result td {
      padding: 6px 4px;
      text-align: left;
      border-bottom: 1px dashed #eee;
    }
    #result td:last-child {
      text-align: right;
      width: 60%;
      color: #111;
      font-weight: 600;
    }
    .micro-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .micro-box span {
      font-size: 12px;
      margin-bottom: 6px;
      font-weight: bold;
      text-transform: uppercase;
      color: #555;
    }
    #micro-canvas {
      width: 100%;
      max-width: 340px;
      height: 160px;
      border: 2px solid #222;
      border-radius: 6px;
      background: #fafafa;
    }
    .screenshot-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      background-color: #005BBB;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .screenshot-btn:hover {
      background-color: #004494;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<div class="calc-box" id="fec-calc">
  <div class="btn-group" id="preset-buttons">
    <button class="preset-btn" data-c="0.01" data-t="20">Saf Fe</button>
    <button class="preset-btn active" data-c="0.45" data-t="20">Çelik 1045</button>
    <button class="preset-btn" data-c="0.8" data-t="20">Ötektoid Çelik</button>
    <button class="preset-btn" data-c="3.0" data-t="20">Dökme Demir</button>
    <button class="preset-btn" data-c="4.3" data-t="20">Ledeburit</button>
    <button class="preset-btn" data-c="0.45" data-t="950">Östenit</button>
  </div>

  <div id="svg-container">
    <svg width="100%" height="100%" viewBox="0 0 350 310" xmlns="http://www.w3.org/2000/svg" id="fec-svg">
      <line x1="45" y1="280" x2="340" y2="280" stroke="#000" stroke-width="2"/>
      <line x1="45" y1="20" x2="45" y2="280" stroke="#000" stroke-width="2"/>
      
      <text x="340" y="305" font-size="12" font-weight="bold" fill="#000" text-anchor="end">% C</text>
      <text id="y-axis-label" x="40" y="12" font-size="12" font-weight="bold" fill="#000" text-anchor="end">T, °F</text>
      
      <g id="fec-grid"></g>
      <g id="fec-lines"></g>
      <g id="fec-labels"></g>
      
      <line id="crosshair-x" x1="45" y1="0" x2="340" y2="0" stroke="#e91e63" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
      <line id="crosshair-y" x1="0" y1="20" x2="0" y2="280" stroke="#e91e63" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
      <circle id="fec-pointer" cx="0" cy="0" r="5" fill="#e91e63" stroke="#fff" stroke-width="2" />
    </svg>
  </div>

  <div class="input-group">
    <div class="input-row">
      <label for="c_val">Karbon Oranı (C, %)</label>
      <input type="number" id="c_val" min="0" max="6.67" step="0.01" value="0.45">
    </div>
    <input type="range" id="c_range" class="range-slider" min="0" max="6.67" step="0.01" value="0.45">
  </div>

  <div class="input-group">
    <div class="input-row">
      <label style="display:flex; align-items:center; gap:8px;" for="t_val">
        Sıcaklık T
        <select id="unit-sel" style="padding: 2px 4px; height: 28px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px;">
          <option value="F" selected>°F</option>
          <option value="C">°C</option>
        </select>
      </label>
      <input type="number" id="t_val" min="32" max="2912" step="10" value="68">
    </div>
    <input type="range" id="t_range" class="range-slider" min="32" max="2912" step="1" value="68">
