<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>İnteraktif Demir-Karbon Faz Diyagramı</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background-color: #f4f6f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .page-title {
      font-size: 20px;
      font-weight: bold;
      color: #222;
      margin-bottom: 20px;
      text-align: center;
    }
    .calc-box {
      background: #ffffff;
      border: 1px solid #dcdfe6;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 800px;
      width: 100%;
      padding: 20px;
    }
    
    /* Yan Yana İki Kolon Düzeni */
    .calc-content {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .left-col {
      flex: 1 1 350px;
      display: flex;
      flex-direction: column;
    }
    .right-col {
      flex: 1 1 320px;
      display: flex;
      flex-direction: column;
    }

    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 15px;
    }
    .btn-group button {
      flex: 1 1 30%;
      padding: 8px 4px;
      font-size: 13px;
      color: #333;
      border: 1px solid #005BBB;
      border-radius: 6px;
      background: #f9f9f9;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-group button:hover {
      background: #e6f2ff;
    }
    .btn-group button.active {
      background: #005BBB;
      color: #fff;
      border-color: #005BBB;
    }
    #svg-container {
      width: 100%;
      height: 300px;
      position: relative;
      cursor: crosshair;
      background: #fafafa;
      border: 1px solid #eee;
      border-radius: 6px;
    }
    .input-group {
      margin-bottom: 12px;
    }
    .input-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .input-row label {
      color: #333;
    }
    .input-row input[type="number"] {
      width: 75px;
      height: 32px;
      padding: 4px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .range-slider {
      -webkit-appearance: none;
      width: 100%;
      margin-top: 6px;
      margin-bottom: 6px;
      background: transparent;
    }
    .range-slider:focus {
      outline: none;
    }
    .range-slider::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #d3d3d3;
      border-radius: 3px;
    }
    .range-slider::-webkit-slider-thumb {
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #005BBB;
      cursor: pointer;
      -webkit-appearance: none;
      margin-top: -6px;
    }
    .result-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 5px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
    #result table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }
    #result th, #result td {
      padding: 6px 4px;
      text-align: left;
      border-bottom: 1px dashed #eee;
    }
    #result td:last-child {
      text-align: right;
      width: 60%;
      color: #111;
      font-weight: 600;
    }
    .micro-box {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .micro-box span {
      font-size: 12px;
      margin-bottom: 6px;
      font-weight: bold;
      text-transform: uppercase;
      color: #555;
    }
    #micro-canvas {
      width: 100%;
      max-width: 340px;
      height: 140px;
      border: 2px solid #222;
      border-radius: 6px;
      background: #fafafa;
    }
    .screenshot-btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      font-size: 14px;
      font-weight: bold;
      background-color: #005BBB;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .screenshot-btn:hover {
      background-color: #004494;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<h1 class="page-title">İnteraktif Demir-Karbon Faz Diyagramı</h1>

<div class="calc-box" id="fec-calc">
  <div class="calc-content">
    
    <!-- Sol Kolon: Butonlar ve Faz Grafiği -->
    <div class="left-col">
      <div class="btn-group" id="preset-buttons">
        <button class="preset-btn" data-c="0.01" data-t="20">Saf Fe</button>
        <button class="preset-btn active" data-c="0.45" data-t="20">Ötektoid Altı Çelik (1045)</button>
        <button class="preset-btn" data-c="0.8" data-t="20">Ötektoid Çelik</button>
        <button class="preset-btn" data-c="3.0" data-t="20">Dökme Demir</button>
        <button class="preset-btn" data-c="4.3" data-t="20">Ledeburit</button>
        <button class="preset-btn" data-c="0.45" data-t="950">Östenit</button>
      </div>

      <div id="svg-container">
        <svg width="100%" height="100%" viewBox="0 0 350 310" xmlns="http://www.w3.org/2000/svg" id="fec-svg">
          <line x1="45" y1="280" x2="340" y2="280" stroke="#000" stroke-width="2"/>
          <line x1="45" y1="20" x2="45" y2="280" stroke="#000" stroke-width="2"/>
          
          <text x="340" y="305" font-size="12" font-weight="bold" fill="#000" text-anchor="end">% C</text>
          <text id="y-axis-label" x="40" y="12" font-size="12" font-weight="bold" fill="#000" text-anchor="end">Sıcaklık, °C</text>
          
          <g id="fec-grid"></g>
          <g id="fec-lines"></g>
          <g id="fec-labels"></g>
          
          <line id="crosshair-x" x1="45" y1="0" x2="340" y2="0" stroke="#e91e63" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
          <line id="crosshair-y" x1="0" y1="20" x2="0" y2="280" stroke="#e91e63" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.8"/>
          <circle id="fec-pointer" cx="0" cy="0" r="5" fill="#e91e63" stroke="#fff" stroke-width="2" />
        </svg>
      </div>
    </div>

    <!-- Sağ Kolon: Kontroller, Sonuç Tablosu ve Mikroyapı -->
    <div class="right-col">
      <div class="input-group">
        <div class="input-row">
          <label for="c_val">Karbon Miktarı (% C)</label>
          <input type="number" id="c_val" min="0" max="6.67" step="0.01" value="0.45">
        </div>
        <input type="range" id="c_range" class="range-slider" min="0" max="6.67" step="0.01" value="0.45">
      </div>

      <div class="input-group">
        <div class="input-row">
          <label style="display:flex; align-items:center; gap:8px;" for="t_val">
            Sıcaklık (T)
            <select id="unit-sel" style="padding: 2px 4px; height: 28px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px;">
              <option value="C" selected>°C</option>
              <option value="F">°F</option>
            </select>
          </label>
          <input type="number" id="t_val" min="0" max="1600" step="10" value="20">
        </div>
        <input type="range" id="t_range" class="range-slider" min="0" max="1600" step="1" value="20">
      </div>

      <div class="result-wrapper">
        <div id="result"></div>
        <div class="micro-box">
          <span>Mikroyapı Görünümü</span>
          <canvas id="micro-canvas" width="336" height="140"></canvas>
        </div>
      </div>
    </div>

  </div>

  <button class="screenshot-btn" onclick="takeScreenshot()">Sonuçları İndir</button>
</div>

<script>
const SVG_W = 350, SVG_H = 310;
const PAD_L = 45, PAD_R = 10, PAD_T = 20, PAD_B = 30;
const W = SVG_W - PAD_L - PAD_R; 
const H = SVG_H - PAD_T - PAD_B;
const MAX_C = 6.67;
const MAX_T = 1600;

function getX(c) { return PAD_L + (c / MAX_C) * W; }
function getY(t) { return PAD_T + H - (t / MAX_T) * H; }

const P = {
  A: [0, 1539], B: [0.51, 1492], H: [0.08, 1492], J: [0.16, 1492],
  N: [0, 1392], G: [0, 911], S: [0.8, 727], E: [2.14, 1147],
  C: [4.3, 1147], D: [6.67, 1320], P: [0.022, 727], Q: [0.006, 0],
  K: [6.67, 727], L: [6.67, 0], F: [6.67, 1147]
};

function drawFeCGrid() {
  const linesGroup = document.getElementById('fec-lines');
  const labelsGroup = document.getElementById('fec-labels');
  let linesHtml = '';
  let labelsHtml = '';
  const isF = document.getElementById('unit-sel').value === 'F';

  const l = (p1, p2, color="#2196F3", width=1.5) => {
    linesHtml += `<line x1="${getX(p1[0])}" y1="${getY(p1[1])}" x2="${getX(p2[0])}" y2="${getY(p2[1])}" stroke="${color}" stroke-width="${width}"/>`;
  };
  
  const txt = (text, p, dx=0, dy=0) => {
    labelsHtml += `<text x="${getX(p[0])+dx}" y="${getY(p[1])+dy}" font-size="12" font-weight="bold" fill="#000" font-family="sans-serif">${text}</text>`;
  };

  linesHtml += `<line x1="${getX(0)}" y1="${getY(1147)}" x2="${getX(6.67)}" y2="${getY(1147)}" stroke="#999" stroke-dasharray="4,2"/>`;
  linesHtml += `<line x1="${getX(0)}" y1="${getY(727)}" x2="${getX(6.67)}" y2="${getY(727)}" stroke="#999" stroke-dasharray="4,2"/>`;

  l(P.A, P.B); l(P.B, P.C); l(P.C, P.D);
  l(P.A, P.H); l(P.H, P.J); l(P.J, P.E); l(P.E, P.C); l(P.C, P.F);
  l(P.N, P.H); l(P.N, P.G); l(P.G, P.S); l(P.S, P.E);
  l(P.G, P.P); l(P.P, P.S); l(P.S, P.K);
  l(P.P, P.Q); 
  l([6.67, 1320], [6.67, 0], "#999", 2);

  txt("A", P.A, -15, 15); txt("C", P.C, -5, 15); txt("D", P.D, 2, 4);
  txt("E", P.E, -5, -8); txt("S", P.S, -8, -8); txt("G", P.G, -15, 5);
  txt("P", P.P, -15, 15);
  
  txt("Sıvı (L)", [3, 1450], 0, 0);
  txt("γ (Östenit)", [1, 1000], 0, 0);
  txt("Fe₃C", [6.67, 600], -40, 0);
  txt("α", [0.01, 800], 10, 0);

  [0.8, 2.14, 4.3, 6.67].forEach(c => {
    labelsHtml += `<text x="${getX(c)}" y="${getY(0)+18}" font-size="12" fill="#000" font-weight="bold" text-anchor="middle">${c}</text>`;
    labelsHtml += `<line x1="${getX(c)}" y1="${getY(0)}" x2="${getX(c)}" y2="${getY(0)+5}" stroke="#000" stroke-width="2"/>`;
  });

  [727, 1147, 1539].forEach(t => {
    let displayT = isF ? Math.round(t * 9/5 + 32) : t;
    labelsHtml += `<text x="${getX(0)-8}" y="${getY(t)+4}" font-size="12" fill="#000" font-weight="bold" text-anchor="end">${displayT}</text>`;
    labelsHtml += `<line x1="${getX(0)-5}" y1="${getY(t)}" x2="${getX(0)}" y2="${getY(t)}" stroke="#000" stroke-width="2"/>`;
  });

  linesGroup.innerHTML = linesHtml;
  labelsGroup.innerHTML = labelsHtml;
}

function getPhaseInfo(c, t) {
  let type = "Alaşım";
  let phase = "";

  if (c <= 2.14) {
    if (c <= 0.022) type = "Ticari Saf Demir";
    else if (c < 0.8) type = "Ötektoid Altı Çelik";
    else if (c === 0.8) type = "Ötektoid Çelik";
    else type = "Ötektoid Üstü Çelik";
  } else {
    if (c < 4.3) type = "Ötektik Altı Dökme Demir";
    else if (c === 4.3) type = "Ötektik Dökme Demir";
    else type = "Ötektik Üstü Dökme Demir";
  }

  if (t > 1539) phase = "Sıvı Faz (L)";
  else if (t > 1147) {
    if (c < 2.14) phase = "Östenit (γ) + Sıvı (L)";
    else phase = "Sıvı (L) + Sementit (I)";
  } else if (t > 727 && t <= 1147) {
    if (c < 0.02) phase = "Ferrit (α)";
    else if (c <= 2.14) phase = "Östenit (γ)";
    else if (c <= 4.3) phase = "Östenit + Ledeburit + Sementit (II)";
    else phase = "Sementit (I) + Ledeburit";
  } else {
    if (c <= 0.02) phase = "Ferrit (α) + Sementit (III)";
    else if (c < 0.8) phase = "Ferrit + Perlit";
    else if (c === 0.8) phase = "Perlit";
    else if (c <= 2.14) phase = "Perlit + Sementit (II)";
    else phase = "Perlit + Sementit + Dönüşmüş Ledeburit";
  }

  if (t > 1400 && c < 0.5) phase = "Sıvı + Östenit";

  return { type, phase };
}

function drawMicrostructure(c, t) {
  const canvas = document.getElementById('micro-canvas');
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const h = canvas.height;
  ctx.clearRect(0, 0, w, h);

  const pearlitePattern = (() => {
    const pCanv = document.createElement('canvas');
    pCanv.width = 24; pCanv.height = 24;
    const pCtx = pCanv.getContext('2d');
    pCtx.fillStyle = '#e0e0e0'; pCtx.fillRect(0,0,24,24);
    pCtx.strokeStyle = '#2c2c2c'; pCtx.lineWidth = 1.5;
    pCtx.beginPath();
    for(let y = 0; y <= 24; y += 4.5) {
      pCtx.moveTo(0, y);
      pCtx.bezierCurveTo(8, y-4, 16, y+4, 24, y);
    }
    pCtx.stroke();
    return ctx.createPattern(pCanv, 'repeat');
  })();

  const drawGrains = (fill, stroke, width) => {
    ctx.fillStyle = fill;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = stroke;
    ctx.lineWidth = width;
    ctx.lineJoin = 'round';
    for (let i = -20; i < w + 20; i += 40) {
      for (let j = -20; j < h + 20; j += 40) {
        ctx.beginPath();
        ctx.moveTo(i + Math.random()*25, j + Math.random()*25);
        ctx.lineTo(i + 40 + Math.random()*25, j + Math.random()*15);
        ctx.lineTo(i + 40 + Math.random()*15, j + 40 + Math.random()*25);
        ctx.lineTo(i + Math.random()*15, j + 40 + Math.random()*15);
        ctx.closePath();
        ctx.stroke();
      }
    }
  };

  if (t > 1400 && c < 4.3) {
    let grad = ctx.createRadialGradient(w/2, h/2, 10, w/2, h/2, w);
    grad.addColorStop(0, '#ffcc80');
    grad.addColorStop(1, '#e64a19');
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,w,h);
  } else if (t > 727) {
    if (c < 2.14) {
      drawGrains('#fff9c4', '#8d6e63', 2);
      ctx.beginPath();
      for(let i=0; i<15; i++) { 
         let x = Math.random()*w, y = Math.random()*h;
         ctx.moveTo(x, y); ctx.lineTo(x+30-Math.random()*15, y+30-Math.random()*15);
      }
      ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 1; ctx.stroke();
    } else {
      ctx.fillStyle = '#fff'; 
      ctx.fillRect(0,0,w,h);
      ctx.fillStyle = '#fff9c4'; 
      for(let i=0; i<80; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random()*w, Math.random()*h, Math.random()*12+4, Math.random()*18+6, Math.random()*Math.PI, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#a1887f'; ctx.lineWidth = 1; ctx.stroke();
      }
    }
  } else {
    if (c <= 0.02) {
      drawGrains('#ffffff', '#616161', 1.5);
    } else if (c < 0.8) {
      drawGrains('#ffffff', '#616161', 1);
      ctx.fillStyle = pearlitePattern;
      let count = Math.floor((c / 0.8) * 45); 
      for(let i=0; i<count; i++) {
        ctx.beginPath();
        ctx.arc(Math.random()*w, Math.random()*h, Math.random()*18+12, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5; ctx.stroke();
      }
    } else if (c === 0.8) {
      drawGrains(pearlitePattern, '#222', 2);
    } else if (c <= 2.14) {
      drawGrains(pearlitePattern, '#ffffff', 5); 
      drawGrains('transparent', '#777', 0.5); 
    } else {
      ctx.fillStyle = '#f5f5f5'; 
      ctx.fillRect(0,0,w,h);
      ctx.fillStyle = pearlitePattern; 
      for(let i=0; i<80; i++) {
        ctx.beginPath();
        ctx.ellipse(Math.random()*w, Math.random()*h, Math.random()*12+6, Math.random()*20+8, Math.random()*Math.PI, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#333'; ctx.lineWidth = 1; ctx.stroke();
      }
      if (c > 4.3) {
        ctx.fillStyle = '#fff';
        ctx.strokeStyle = '#555';
        for(let i=0; i<25; i++) {
          ctx.beginPath();
          let sx = Math.random()*w, sy = Math.random()*h;
          ctx.moveTo(sx, sy); ctx.lineTo(sx+50, sy-20); ctx.lineTo(sx+55, sy-12);
          ctx.closePath();
          ctx.fill(); ctx.stroke();
        }
      }
    }
  }
}

let current_unit = 'C';
document.getElementById('unit-sel').addEventListener('change', function() {
  let val = parseFloat(document.getElementById('t_val').value);
  let t_c = (current_unit === 'F') ? (val - 32) * 5/9 : val;
  
  current_unit = this.value;
  let t_input = document.getElementById('t_val');
  let t_range = document.getElementById('t_range');
  
  if (current_unit === 'F') {
    t_input.min = 32; t_input.max = 2912;
    t_range.min = 32; t_range.max = 2912;
    let newF = Math.round(t_c * 9/5 + 32);
    t_input.value = newF; t_range.value = newF;
  } else {
    t_input.min = 0; t_input.max = 1600;
    t_range.min = 0; t_range.max = 1600;
    let newC = Math.round(t_c);
    t_input.value = newC; t_range.value = newC;
  }
  
  document.getElementById('y-axis-label').textContent = current_unit === 'F' ? "Sıcaklık, °F" : "Sıcaklık, °C";
  drawFeCGrid();
  calculateFeC();
});

function calculateFeC() {
  let c = parseFloat(document.getElementById('c_val').value);
  let inputT = parseFloat(document.getElementById('t_val').value);
  let isF = document.getElementById('unit-sel').value === 'F';
  
  let t_c = isF ? (inputT - 32) * 5/9 : inputT;
  
  if (c < 0) c = 0; if (c > MAX_C) c = MAX_C;
  if (t_c < 0) t_c = 0; if (t_c > MAX_T) t_c = MAX_T;

  const px = getX(c);
  const py = getY(t_c);
  
  document.getElementById('fec-pointer').setAttribute('cx', px);
  document.getElementById('fec-pointer').setAttribute('cy', py);
  document.getElementById('crosshair-x').setAttribute('y1', py);
  document.getElementById('crosshair-x').setAttribute('y2', py);
  document.getElementById('crosshair-y').setAttribute('x1', px);
  document.getElementById('crosshair-y').setAttribute('x2', px);

  const info = getPhaseInfo(c, t_c);
  drawMicrostructure(c, t_c);
  
  let unitStr = isF ? '°F' : '°C';

  document.getElementById('result').innerHTML = `
    <table>
      <tr><td>Alaşım Tipi</td><td>${info.type}</td></tr>
      <tr><td>Karbon Oranı</td><td>% ${c.toFixed(2)}</td></tr>
      <tr><td>Sıcaklık</td><td>${inputT.toFixed(0)} ${unitStr}</td></tr>
      <tr><td>Mevcut Faz</td><td style="color:#2e7d32; font-weight:bold;">${info.phase}</td></tr>
    </table>
  `;
}

function syncInputs(idPrefix) {
  const numInput = document.getElementById(idPrefix + '_val');
  const rangeInput = document.getElementById(idPrefix + '_range');
  if (!numInput || !rangeInput) return;
  
  numInput.addEventListener('input', () => { 
    rangeInput.value = numInput.value; calculateFeC(); 
  });
  rangeInput.addEventListener('input', () => { 
    numInput.value = rangeInput.value; calculateFeC(); 
  });
}

syncInputs('c');
syncInputs('t');

document.querySelectorAll('.preset-btn').forEach(btn => {
  btn.addEventListener('click', (e) => {
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    e.currentTarget.classList.add('active');
    
    let c_val = e.currentTarget.getAttribute('data-c');
    let t_c = parseFloat(e.currentTarget.getAttribute('data-t'));
    let isF = document.getElementById('unit-sel').value === 'F';
    let t_display = isF ? Math.round(t_c * 9/5 + 32) : t_c;
    
    document.getElementById('c_val').value = c_val;
    document.getElementById('c_range').value = c_val;
    document.getElementById('t_val').value = t_display;
    document.getElementById('t_range').value = t_display;
    
    calculateFeC();
  });
});

document.getElementById('fec-svg').addEventListener('mousedown', function(e) {
  const pt = this.createSVGPoint();
  pt.x = e.clientX;
  pt.y = e.clientY;
  const svgP = pt.matrixTransform(this.getScreenCTM().inverse());
  
  let c = ((svgP.x - PAD_L) / W) * MAX_C;
  let t_c = ((PAD_T + H - svgP.y) / H) * MAX_T;
  
  if (c >= 0 && c <= MAX_C && t_c >= 0 && t_c <= MAX_T) {
    let isF = document.getElementById('unit-sel').value === 'F';
    let t_display = isF ? Math.round(t_c * 9/5 + 32) : Math.round(t_c);
    
    document.getElementById('c_val').value = c.toFixed(2);
    document.getElementById('c_range').value = c.toFixed(2);
    document.getElementById('t_val').value = t_display;
    document.getElementById('t_range').value = t_display;
    
    document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
    calculateFeC();
  }
});

function takeScreenshot() {
  const calcBox = document.getElementById('fec-calc');
  if (!calcBox) return;
  html2canvas(calcBox, { backgroundColor: '#ffffff', scale: 2 }).then(canvas => {
    const link = document.createElement('a');
    link.download = 'fec_diyagrami.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

drawFeCGrid();
calculateFeC();
</script>
